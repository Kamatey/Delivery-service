[project]
name = "users-service"
version = "1.0.0"
description = "Stores customers and their delivery addresses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
